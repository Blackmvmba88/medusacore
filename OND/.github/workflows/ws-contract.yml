name: ws-contract


on:
  push:
    branches: [main]
    paths:
      - 'tests/test_ws_contract.py'
      - 'server.py'
      - 'main.js'
      - '.github/copilot-instructions.md'
      - '.github/workflows/ws-contract.yml'
  pull_request:
    paths:
      - 'tests/test_ws_contract.py'
      - 'server.py'
      - 'main.js'
      - '.github/copilot-instructions.md'
      - '.github/workflows/ws-contract.yml'

jobs:
  ws-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python3 -m pip install -r requirements.txt
          python3 -m pip install -r requirements-test.txt
      - name: Run WebSocket contract tests
        id: wscontract
        run: |
          python3 -m unittest discover -s tests -p 'test_ws_contract.py' 2>&1 | tee ws-contract.log
      - name: Upload contract test log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ws-contract-log
          path: ws-contract.log
