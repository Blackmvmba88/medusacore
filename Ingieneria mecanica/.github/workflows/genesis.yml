name: Genesis CI

on:
  push:
    paths:
      - 'core/**'
      - 'scripts/genesis_run.py'
      - 'tests/**'
      - 'docs/genesis.md'

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [3.10, 3.11]
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install pytest
      - name: Run tests
        run: pytest -q

  adversarial:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: 3.10
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install pytest
      - name: Run adversarial tests (blocking)
        run: pytest -q tests/test_adversarial.py

  validation:
    runs-on: ubuntu-latest
    needs: [test, adversarial]
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: 3.10
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install pytest
      - name: Run validation (Blue Team)
        run: pytest -q tests/test_validation.py
