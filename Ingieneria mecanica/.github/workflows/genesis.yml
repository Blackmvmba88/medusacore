name: Genesis CI

on:
  push:
    paths:
      - 'core/**'
      - 'scripts/genesis_run.py'
      - 'tests/**'
      - 'docs/genesis.md'

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [3.10, 3.11]
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install pytest
      - name: Run tests
        run: pytest -q

  adversarial:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: 3.10
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install pytest
      - name: Run adversarial tests (blocking)
        run: pytest -q tests/test_adversarial.py

  validation:
    runs-on: ubuntu-latest
    needs: [test, adversarial]
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: 3.10
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install pytest
      - name: Run validation (Blue Team)
        run: pytest -q tests/test_validation.py

  integration:
    runs-on: ubuntu-latest
    needs: validation
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: 3.10
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install pytest
      - name: Generate adversarial corpus
        run: python tools/generate_adversarial_corpus.py --out tests/adversarial_corpus
      - name: Run integration tests
        run: pytest -q tests/test_adversarial_corpus_integration.py
      - name: Run forensics persistence tests
        run: pytest -q tests/test_forensics_persistence.py

  persist-forensics:
    runs-on: ubuntu-latest
    needs: integration
    environment: forensics
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: 3.10
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install pytest boto3 google-cloud-storage moto[server]
      - name: Start moto S3 server (for dry-run uploads)
        run: |
          nohup moto_server s3 -p 5000 &
          sleep 1
      - name: Create test bucket
        run: |
          python - <<'PY'
import boto3, os
client=boto3.client('s3', endpoint_url='http://localhost:5000')
client.create_bucket(Bucket='test-bucket')
print('created')
PY
      - name: Ingest generated corpus and persist forensics (requires approval)
        env:
          AWS_S3_ENDPOINT: http://localhost:5000
        run: |
          python tools/ingest_and_persist.py \
            --src tests/adversarial_corpus \
            --branch ${{ github.ref_name }} \
            --out tests/adversarial_artifacts \
            --batch \
            --s3-bucket test-bucket \
            --retention-days 90 \
            --approved-by "ci@bot"
      - name: Upload artifacts (if any)
        uses: actions/upload-artifact@v4
        with:
          name: adversarial-artifacts
          path: tests/adversarial_artifacts
