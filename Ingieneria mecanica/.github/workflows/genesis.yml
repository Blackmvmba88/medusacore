name: Genesis CI

on:
  push:
    paths:
      - 'core/**'
      - 'scripts/genesis_run.py'
      - 'tests/**'
      - 'docs/genesis.md'

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [3.10, 3.11]
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install pytest
      - name: Run tests
        run: pytest -q

  adversarial:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: 3.10
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install pytest
      - name: Run adversarial tests (blocking)
        run: pytest -q tests/test_adversarial.py

  validation:
    runs-on: ubuntu-latest
    needs: [test, adversarial]
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: 3.10
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install pytest
      - name: Run validation (Blue Team)
        run: pytest -q tests/test_validation.py

  integration:
    runs-on: ubuntu-latest
    needs: validation
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: 3.10
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install pytest
      - name: Generate adversarial corpus
        run: python tools/generate_adversarial_corpus.py --out tests/adversarial_corpus
      - name: Run integration tests
        run: pytest -q tests/test_adversarial_corpus_integration.py
      - name: Run forensics persistence tests
        run: pytest -q tests/test_forensics_persistence.py
      - name: Upload artifacts (if any)
        uses: actions/upload-artifact@v4
        with:
          name: adversarial-artifacts
          path: tests/adversarial_artifacts
